name: RikkaHub Build

on:
  workflow_dispatch:

  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Prepare google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "❌ GOOGLE_SERVICES_JSON_BASE64 Secret 未配置"
            exit 1
          fi

          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" \
            | base64 --decode \
            > app/google-services.json

          if [ ! -s app/google-services.json ]; then
            echo "❌ google-services.json 为空"
            exit 1
          fi

          python3 -m json.tool app/google-services.json > /dev/null

          echo "✅ google-services.json OK"

      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: List APK
        run: |
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RikkaHub-Debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
